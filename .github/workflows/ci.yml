name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: >
          npm exec -- prettier --write
          src/capabilities/basePlanning/assignRoadRcls.ts
          src/capabilities/basePlanning/basePlan.ts
          src/capabilities/basePlanning/basePlanCodec.ts
          src/capabilities/basePlanning/basePlanStore.ts
          src/capabilities/basePlanning/finalizeBasePlan.ts
          src/colony/build/construction.ts
          src/colony/colonyManager.ts
          src/colony/harvest/harvest.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            src/capabilities/basePlanning/assignRoadRcls.ts
            src/capabilities/basePlanning/basePlan.ts
            src/capabilities/basePlanning/basePlanCodec.ts
            src/capabilities/basePlanning/basePlanStore.ts
            src/capabilities/basePlanning/finalizeBasePlan.ts
            src/colony/build/construction.ts
            src/colony/colonyManager.ts
            src/colony/harvest/harvest.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

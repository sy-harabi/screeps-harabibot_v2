<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1770" viewBox="0 0 1200 1770" role="img" aria-labelledby="title desc">
  <title id="title">HarabiBot v2 harvest flow</title>
  <desc id="desc">Harvest state preparation, source economy and policy, worker execution, hauling phase one, colony consumers and logistics, then hauling phase two.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .bg{fill:#fff}
      .node{fill:#f6f8fa;stroke:#57606a;stroke-width:2}
      .accent{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
      .decision{fill:#fff8c5;stroke:#9a6700;stroke-width:2}
      .external{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}
      .text{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f;text-anchor:middle}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a;text-anchor:middle}
      .edge{fill:none;stroke:#57606a;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%"/>

  <rect class="accent" x="390" y="25" width="420" height="58" rx="10"/>
  <text class="text" x="600" y="60">runHarvest</text>
  <path class="edge" d="M 600 83 L 600 120"/>

  <polygon class="decision" points="600,120 800,185 600,250 400,185"/>
  <text class="text" x="600" y="191">Plans and intel ready?</text>

  <path class="edge" d="M 400 185 L 190 185 L 190 255"/>
  <text class="small" x="315" y="173">no</text>
  <rect class="node" x="60" y="255" width="260" height="58" rx="10"/>
  <text class="text" x="190" y="290">Return empty result</text>

  <text class="small" x="625" y="274">yes</text>
  <path class="edge" d="M 600 250 L 600 295"/>
  <rect class="node" x="320" y="295" width="560" height="78" rx="10"/>
  <text class="text" x="600" y="329">Prepare room and source state</text>
  <text class="text" x="600" y="350">plans + intel + paths + visible resources</text>

  <path class="edge" d="M 600 373 L 600 410"/>
  <rect class="node" x="320" y="410" width="560" height="78" rx="10"/>
  <text class="text" x="600" y="444">Index harvest creeps</text>
  <text class="text" x="600" y="465">measure reservation, harvest and carry capacity</text>

  <path class="edge" d="M 600 488 L 600 525"/>
  <rect class="node" x="320" y="525" width="560" height="78" rx="10"/>
  <text class="text" x="600" y="559">Reconcile maintenance</text>
  <text class="text" x="600" y="580">inspect active remote construction</text>

  <path class="edge" d="M 600 603 L 600 640"/>
  <rect class="accent" x="320" y="640" width="560" height="58" rx="10"/>
  <text class="text" x="600" y="675">Process owned and remote sources</text>

  <path class="edge" d="M 600 698 L 600 735"/>
  <rect class="node" x="320" y="735" width="560" height="78" rx="10"/>
  <text class="text" x="600" y="769">Allocate shared hauler capacity</text>
  <text class="text" x="600" y="790">compute miner and transport readiness</text>

  <path class="edge" d="M 500 813 L 500 845 L 290 845 L 290 870"/>
  <path class="edge" d="M 700 813 L 700 845 L 910 845 L 910 870"/>

  <rect class="node" x="80" y="870" width="420" height="78" rx="10"/>
  <text class="text" x="290" y="904">Compute sustainable income</text>
  <text class="text" x="290" y="925">max income + spawn usage</text>

  <rect class="node" x="700" y="870" width="420" height="78" rx="10"/>
  <text class="text" x="910" y="904">Apply reservation, maintenance</text>
  <text class="text" x="910" y="925">and remote-road policy</text>

  <path class="edge" d="M 290 948 L 290 980 L 600 980 L 600 1005"/>
  <path class="edge" d="M 910 948 L 910 980 L 600 980 L 600 1005"/>

  <rect class="node" x="320" y="1005" width="560" height="58" rx="10"/>
  <text class="text" x="600" y="1040">Emit harvest spawn demand when needed</text>

  <path class="edge" d="M 600 1063 L 600 1100"/>
  <rect class="node" x="320" y="1100" width="560" height="78" rx="10"/>
  <text class="text" x="600" y="1134">Run reservers, miners, remote builders</text>
  <text class="text" x="600" y="1155">and remote repairers</text>

  <path class="edge" d="M 600 1178 L 600 1215"/>
  <rect class="accent" x="320" y="1215" width="560" height="78" rx="10"/>
  <text class="text" x="600" y="1249">Hauling phase 1</text>
  <text class="text" x="600" y="1270">assign / fetch / load / return + register suppliers</text>

  <path class="edge" d="M 600 1293 L 600 1325"/>
  <rect class="node" x="320" y="1325" width="560" height="58" rx="10"/>
  <text class="text" x="600" y="1360">Return HarvestResult + hauling context</text>

  <path class="edge" d="M 600 1383 L 600 1415"/>
  <rect class="external" x="320" y="1415" width="560" height="78" rx="10"/>
  <text class="text" x="600" y="1449">Construction → Build → Upgrade → Towers</text>
  <text class="small" x="600" y="1471">other colony systems register energy demand</text>

  <path class="edge" d="M 600 1493 L 600 1530"/>
  <rect class="external" x="320" y="1530" width="560" height="78" rx="10"/>
  <text class="text" x="600" y="1564">Run colony logistics</text>
  <text class="small" x="600" y="1586">match inbound suppliers to requests</text>

  <path class="edge" d="M 600 1608 L 600 1645"/>
  <rect class="accent" x="320" y="1645" width="560" height="92" rx="10"/>
  <text class="text" x="600" y="1677">Hauling phase 2</text>
  <text class="text" x="600" y="1698">finish / fallback delivery + same-tick reassignment</text>
  <text class="small" x="600" y="1721">optional relay + pull coordination</text>
</svg>
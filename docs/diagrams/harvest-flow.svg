<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .bg{fill:#fff}.node{fill:#f6f8fa;stroke:#57606a;stroke-width:2}.accent{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
      .decision{fill:#fff8c5;stroke:#9a6700;stroke-width:2}.text{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f;text-anchor:middle}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a;text-anchor:middle}
      .edge{fill:none;stroke:#57606a;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#57606a;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs><rect class="bg" width="100%" height="100%"/><rect class="accent" x="390" y="30" width="420" height="58" rx="10"/><text class="text" x="600" y="65">runHarvest</text><path class="edge" d="M 600 88 L 600 125"/><polygon class="decision" points="600,125 800,190 600,255 400,190"/><text class="text" x="600" y="196">Plans and intel ready?</text><path class="edge" d="M 400 190 L 190 190 L 190 260"/><rect class="node" x="60" y="260" width="260" height="58" rx="10"/><text class="text" x="190" y="295">Return empty result</text><text class="small" x="315" y="178">no</text><text class="small" x="625" y="279">yes</text><path class="edge" d="M 600 255 L 600 300"/><rect class="node" x="320" y="300" width="560" height="78" rx="10"/><text class="text" x="600" y="334.5">Prepare room and source state</text><text class="text" x="600" y="355.5">plans + intel + paths + visible resources</text><path class="edge" d="M 600 378 L 600 415"/><rect class="node" x="320" y="415" width="560" height="78" rx="10"/><text class="text" x="600" y="449.5">Index harvest creeps</text><text class="text" x="600" y="470.5">measure reservation, harvest and carry capacity</text><path class="edge" d="M 600 493 L 600 530"/><rect class="node" x="320" y="530" width="560" height="78" rx="10"/><text class="text" x="600" y="564.5">Reconcile maintenance</text><text class="text" x="600" y="585.5">inspect active remote construction</text><path class="edge" d="M 600 608 L 600 645"/><rect class="accent" x="320" y="645" width="560" height="58" rx="10"/><text class="text" x="600" y="680">Process owned and remote sources</text><path class="edge" d="M 600 703 L 600 740"/><rect class="node" x="320" y="740" width="560" height="78" rx="10"/><text class="text" x="600" y="774.5">Allocate shared hauler capacity</text><text class="text" x="600" y="795.5">compute miner and transport readiness</text><path class="edge" d="M 500 818 L 500 850 L 290 850 L 290 875"/><path class="edge" d="M 700 818 L 700 850 L 910 850 L 910 875"/><rect class="node" x="80" y="875" width="420" height="78" rx="10"/><text class="text" x="290" y="909.5">Compute sustainable income</text><text class="text" x="290" y="930.5">max income + spawn usage</text><rect class="node" x="700" y="875" width="420" height="78" rx="10"/><text class="text" x="910" y="909.5">Apply reservation, maintenance</text><text class="text" x="910" y="930.5">and remote-road policy</text><path class="edge" d="M 290 953 L 290 985 L 600 985 L 600 1010"/><path class="edge" d="M 910 953 L 910 985 L 600 985 L 600 1010"/><rect class="node" x="320" y="1010" width="560" height="58" rx="10"/><text class="text" x="600" y="1045">Emit harvest spawn demand when needed</text><path class="edge" d="M 600 1068 L 600 1105"/><rect class="node" x="320" y="1105" width="560" height="78" rx="10"/><text class="text" x="600" y="1139.5">Run reservers, miners, remote builders</text><text class="text" x="600" y="1160.5">and remote repairers</text><path class="edge" d="M 600 1183 L 600 1215"/><rect class="accent" x="320" y="1215" width="560" height="58" rx="10"/><text class="text" x="600" y="1250">Hauling phase 1 → return HarvestResult</text></svg>